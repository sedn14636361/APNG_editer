/* 保存経路は2つ。claude.ai で公開されたページはサンドボックスが <a download> を
   一律で無効化するので downloads ケーパビリティ経由で保存する。
   ローカルのHTMLとして開いた場合はケーパビリティが無いので通常のダウンロードに落とす。 */
const DL_MAX=16*1024*1024;
let dlPromise=null;
function downloadsCap(){
  if(!dlPromise){
    dlPromise=(window.claude&&typeof window.claude.use==='function')
      ? Promise.resolve(window.claude.use('downloads')).catch(()=>null)
      : Promise.resolve(null);
  }
  return dlPromise;
}
downloadsCap();   // 起動時に先に解決させ、書き出し時に待たせない

function saveDirect(blob,name){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
/* 公開されたページかどうか。ここでは <a download> が働かないため案内を出し分ける */
const inSandbox=()=>!!(window.claude&&typeof window.claude.use==='function');
let DL_OK=true;
downloadsCap().then(d=>{ DL_OK=!!d||!inSandbox(); });
const saveHintImg=()=>DL_OK
  ? '保存が始まらない場合は、下のボタンか、画像を長押し／右クリックして「画像を保存」を選んでください。'
  : 'この画面ではボタンからの保存ができません。上の画像を長押し／右クリックして「画像を保存」を選んでください。';

/* 結果オーバーレイ：保存が塞がれた環境でも画像そのものから保存できるようにする */
function showOverlay({title,note,imgSrc,dlHref,dlName}){
  el('ovTitle').textContent=title;
  el('ovNote').textContent=note||'';
  const im=el('ovImg');
  im.style.display=imgSrc?'block':'none'; if(imgSrc) im.src=imgSrc;
  const a=el('ovDl');
  if(dlHref&&DL_OK){ a.style.display=''; a.href=dlHref; a.setAttribute('download',dlName); }
  else a.style.display='none';
  el('ov').classList.add('on');
}

async function saveBlob(blob,name){
  const dl=await downloadsCap();
  if(!dl){
    saveDirect(blob,name);
    if(inSandbox()) return false;          // 実行はしたが成功したとは限らない
    toast(`${name} を保存しました`); return true;
  }
  if(blob.size>DL_MAX){
    showError(`ファイルが ${fmtBytes(blob.size)} あり、この画面から保存できる上限（16MB）を超えています。\n`
      +`キャンバスを小さくするか、コマ数を減らしてから書き出し直してください。`);
    toast('サイズが大きすぎて保存できませんでした');
    return false;
  }
  try{
    await dl.save({filename:name,data:blob});
    toast(`${name} を保存しました`);
    return true;
  }catch(e){
    const code=e&&e.code;
    if(code==='declined'){ toast('保存を取り消しました'); return false; }
    if(code==='rate_limited'){ toast('保存の確認中です。少し待ってからもう一度どうぞ'); return false; }
    if(code==='too_large'){ toast('サイズが大きすぎて保存できませんでした'); return false; }
    saveDirect(blob,name);   // 想定外の失敗は通常のダウンロードで拾う
    toast('保存を試みました');
    return true;
  }
}
function baseName(){ const L=D.layers[0]; return L?L.name.replace(/\.[^.]+$/,''):'apng-scope'; }
/* ============ 5MB以下に収める圧縮 ============
   PNGは非可逆圧縮を持たないので、削れるのは「色数」と「画素数」だけ。
   減色は絵によっては逆効果（ディザのノイズで増える）なので毎回両方試して小さい方を採り、
   それでも超える場合だけ解像度を落とす。大きさは画素数にほぼ比例するので
   1回の見積もりでだいたい収まり、最大3回まで詰める。 */
const SIZE_TARGET=5*1024*1024;
const tick=()=>new Promise(r=>setTimeout(r,0));

async function buildFrameBuffers(scale,status){
  const W=Math.max(1,Math.round(D.W*scale)), H=Math.max(1,Math.round(D.H*scale));
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d',{willReadFrequently:true});
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  const bufs=[],dels=[];
  for(let i=0;i<D.frames.length;i++){
    if(status&&(i%4===0||i===D.frames.length-1)){ status(`合成中 ${W}×${H} … ${i+1}/${D.frames.length}`); await tick(); }
    compositeTo(g,i,W,H,scale);
    bufs.push(g.getImageData(0,0,W,H).data.buffer);
    dels.push(Math.max(DELAY_MIN,D.frames[i].delay));
  }
  return {bufs,dels,W,H};
}
/* ---- 減色前のディザ ----
   滑らかなグラデーションを256色に落とすと等高線状の帯が出るので、
   量子化の直前に4×4の順序ディザで半階調ぶんの揺らぎを混ぜて帯を分解する。 */
const BAYER4=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function ditherBuf(buf,w,h,amp){
  const src=new Uint8Array(buf), d=new Uint8ClampedArray(src);
  for(let y=0;y<h;y++){
    const by=(y&3)<<2;
    for(let x=0;x<w;x++){
      const i=(y*w+x)<<2;
      if(src[i+3]===0) continue;
      const o=(BAYER4[by|(x&3)]/16-.46875)*amp;
      d[i]=src[i]+o; d[i+1]=src[i+1]+o; d[i+2]=src[i+2]+o;
    }
  }
  return d.buffer;
}
function encodeFrames(fr,ps){
  const bufs=ps?fr.bufs.map(b=>ditherBuf(b,fr.W,fr.H,5)):fr.bufs;
  return UPNG.encode(bufs,fr.W,fr.H,ps,fr.dels,ps===0);
}

async function encodeApng(status,fitTarget){
  const finish=(buf,W,H,note)=>{
    let out=buf;
    if(D.frames.length>1&&D.loop>0) out=setNumPlays(out,D.loop);
    return {blob:new Blob([out],{type:'image/png'}),W,H,note};
  };
  /* 減色は最後の手段。まず色をそのままに解像度だけ下げ、
     下限（元の60%）まで下げても収まらないときに初めて減色する。 */
  const FLOOR=0.6;
  let fr=await buildFrameBuffers(1,status);
  status('圧縮中…'); await tick();
  let out=encodeFrames(fr,0);
  if(!fitTarget||out.byteLength<=SIZE_TARGET)
    return finish(out,fr.W,fr.H,fitTarget?'':'圧縮なし');

  /* 1段目：可逆のまま縮小。下限まで下げても届かないと分かるときは飛ばす */
  if(out.byteLength*FLOOR*FLOOR*0.9<=SIZE_TARGET){
    let scale=1;
    for(let k=0;k<3&&scale>FLOOR;k++){
      scale=Math.max(FLOOR, scale*Math.sqrt(SIZE_TARGET/out.byteLength)*0.88);
      fr=await buildFrameBuffers(scale,status);
      status(`圧縮中 ${fr.W}×${fr.H}…`); await tick();
      out=encodeFrames(fr,0);
      if(out.byteLength<=SIZE_TARGET)
        return finish(out,fr.W,fr.H,`解像度 ${fr.W}×${fr.H}（${Math.round(scale*100)}%）・減色なし`);
    }
  }

  /* 2段目：ここで初めて減色する。解像度は元に戻してからやり直す */
  fr=await buildFrameBuffers(1,status);
  status('減色して圧縮中…'); await tick();
  out=encodeFrames(fr,256);
  if(out.byteLength<=SIZE_TARGET) return finish(out,fr.W,fr.H,'256色に減色');

  let scale=1, last={out,fr};
  for(let k=0;k<3;k++){
    scale=Math.max(0.12, scale*Math.sqrt(SIZE_TARGET/out.byteLength)*0.88);
    fr=await buildFrameBuffers(scale,status);
    status(`圧縮中 ${fr.W}×${fr.H}…`); await tick();
    out=encodeFrames(fr,256);
    last={out,fr};
    if(out.byteLength<=SIZE_TARGET)
      return finish(out,fr.W,fr.H,`解像度 ${fr.W}×${fr.H}（${Math.round(scale*100)}%）・256色に減色`);
    if(scale<=0.12) break;
  }
  return finish(last.out,last.fr.W,last.fr.H,
    `解像度 ${last.fr.W}×${last.fr.H}・256色に減色（これ以上は縮められませんでした）`);
}

el('btnExportApng').addEventListener('click',async()=>{
  const btn=el('btnExportApng'), label=btn.textContent;
  if(!D.frames.length) return;

    const nm=`${baseName()}-edit.png`;
    const ok=await saveBlob(r.blob,nm);
    /* 保存が塞がれる環境でも必ず受け取れるよう、書き出した画像を画面に出す */
    const url=URL.createObjectURL(r.blob);
    showOverlay({
      title:'アニメーションPNGを書き出しました',
      note:`${D.W}×${D.H} / ${D.frames.length}コマ / ${fmtBytes(r.blob.size)}`
        +(r.note?`（${r.note}）`:'')+'。'+saveHintImg(),
      imgSrc:url, dlHref:url, dlName:nm
    });
    if(ok&&r.note) toast(`${fmtBytes(r.blob.size)} で保存 — ${r.note}`);
  }catch(e){
    console.error(e); showError('APNGの書き出しに失敗しました: '+(e&&e.message||e)); toast('書き出しに失敗しました');
  }finally{ btn.textContent=label; btn.disabled=false; }
});

el('btnExportPng').addEventListener('click',async()=>{
  const btn=el('btnExportPng'), label=btn.textContent;
  btn.disabled=true; clearError();
  try{
    const fit=el('optFit5').checked;
    let scale=1, blob=null, note='';
    for(let k=0;k<4;k++){
      const W=Math.max(1,Math.round(D.W*scale)), H=Math.max(1,Math.round(D.H*scale));
      const c=document.createElement('canvas'); c.width=W; c.height=H;
      const g=c.getContext('2d'); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
      compositeTo(g,D.cur,W,H,scale);
      blob=await new Promise(res=>c.toBlob(res,'image/png'));
      if(!blob) throw new Error('画像を作れませんでした');
      if(!fit||blob.size<=SIZE_TARGET){ if(scale<1) note=`解像度 ${W}×${H}（${Math.round(scale*100)}%）`; break; }
      scale=Math.max(0.12,scale*Math.sqrt(SIZE_TARGET/blob.size)*0.93);
      btn.textContent='圧縮中…'; await tick();
    }
    btn.textContent='保存中…'; await tick();
    const nm=`${baseName()}-frame${D.cur}.png`;
    const ok=await saveBlob(blob,nm);
    const url=URL.createObjectURL(blob);
    showOverlay({
      title:`PNGを書き出しました（コマ ${D.cur+1}）`,
      note:`${fmtBytes(blob.size)}`+(note?`（${note}）`:'')+'。'+saveHintImg(),
      imgSrc:url, dlHref:url, dlName:nm
    });
    if(ok&&note) toast(`${fmtBytes(blob.size)} で保存 — ${note}`);
  }catch(e){
    console.error(e); showError('PNGの保存に失敗しました: '+(e&&e.message||e)); toast('保存に失敗しました');
  }finally{ btn.textContent=label; btn.disabled=false; }
});
/* UPNGはnum_playsを常に0で書くので、acTLを直接書き換えてループ回数を反映する */
function setNumPlays(arrbuf,plays){
  const d=new Uint8Array(arrbuf), dv=new DataView(d.buffer);
  let off=8;
  while(off+8<=d.length){
    const len=dv.getUint32(off);
    const type=String.fromCharCode(d[off+4],d[off+5],d[off+6],d[off+7]);
    if(type==='acTL'){
      dv.setUint32(off+12,plays>>>0);
      dv.setUint32(off+8+len,crc32(d,off+4,4+len));
      break;
    }
    if(type==='IDAT'||type==='IEND') break;
    off+=12+len;
  }
  return d.buffer;
}
const CRC_TABLE=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0}
  return t})();
function crc32(buf,off,len){
  let c=0xFFFFFFFF;
  for(let i=0;i<len;i++) c=CRC_TABLE[(c^buf[off+i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}

el('ovClose').addEventListener('click',()=>el('ov').classList.remove('on'));
el('ov').addEventListener('click',e=>{ if(e.target===el('ov')) el('ov').classList.remove('on'); });


/* ============ 数値入力のホイール操作 ============
   数値フォームの上でホイールを回すと1段階、Shiftを押しながらだと10段階まとめて動く。
   段の大きさは各入力の step をそのまま使うので、px入力なら1px/10px、
   秒の入力（step=0.05）なら0.05秒/0.5秒になる。
   スライダーは パネル のスクロール中に触れてしまうため、選択（クリック）している間だけ効かせる。 */
function wheelStep(el,dir,big){
  const st=parseFloat(el.step)||1, s=big?st*10:st;
  const min=el.min!==''?parseFloat(el.min):-Infinity;
  const max=el.max!==''?parseFloat(el.max):Infinity;
  const cur=parseFloat(el.value);
  const base=isNaN(cur)?(isFinite(min)?min:0):cur;
  let v=Math.round((base+dir*s)/s)*s;
  v=Math.min(max,Math.max(min,v));
  const dec=(String(st).split('.')[1]||'').length;
  el.value=dec?v.toFixed(dec):String(Math.round(v));
  el.dispatchEvent(new Event('input',{bubbles:true}));
  el.dispatchEvent(new Event('change',{bubbles:true}));
}
function bindWheel(el){
  if(el.dataset.wh) return; el.dataset.wh='1';
  el.addEventListener('wheel',e=>{
    if(el.disabled||el.readOnly) return;
    if(el.type==='range'&&document.activeElement!==el) return;   // スライダーは選択中のみ
    e.preventDefault();
    wheelStep(el,e.deltaY<0?1:-1,e.shiftKey);
  },{passive:false});
  const hint=el.type==='range'?'選択中はホイールで増減（Shiftで10段階）':'ホイールで増減、Shift+ホイールで10段階';
  el.title=el.title?el.title+' / '+hint:hint;
}
function bindWheels(root){
  const r=root||document;
  if(r.matches&&r.matches('input[type=number],input[type=range]')) return bindWheel(r);
  (r.querySelectorAll?r.querySelectorAll('input[type=number],input[type=range]'):[]).forEach(bindWheel);
}
bindWheels();
/* 後から組み立て直される入力（スライダー群やレイヤー編集）にも自動で効かせる */
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType===1)bindWheels(n)})
  .observe(document.body,{childList:true,subtree:true});

syncDocStats();
